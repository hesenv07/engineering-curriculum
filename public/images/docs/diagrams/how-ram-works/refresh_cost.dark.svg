<text x="60" y="150" text-anchor="middle" font-size="11" fill="#99A1B3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0 ms</text>
<text x="660" y="150" text-anchor="end" font-size="11" fill="#99A1B3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">64 ms</text>
<text x="360" y="94" text-anchor="middle" font-size="12.5" fill="#E06C60" font-family="system-ui, sans-serif">each tick is a refresh command</text>
<text x="360" y="174" text-anchor="middle" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif">8,192 of them fit in the 64 ms window — one every 7.8 microseconds</text>
<text x="250" y="204" text-anchor="end" font-size="12.5" fill="#F6F7F9" font-family="system-ui, sans-serif">what a refresh does</text>
<text x="266" y="204" text-anchor="start" font-size="12" fill="#99A1B3" font-family="system-ui, sans-serif">reads a whole row and writes it straight back</text>
<text x="250" y="234" text-anchor="end" font-size="12.5" fill="#F6F7F9" font-family="system-ui, sans-serif">what it costs you</text>
<text x="266" y="234" text-anchor="start" font-size="12" fill="#99A1B3" font-family="system-ui, sans-serif">that bank cannot answer a real request while it happens</text>
<text x="250" y="264" text-anchor="end" font-size="12.5" fill="#F6F7F9" font-family="system-ui, sans-serif">why you never notice</text>
<text x="266" y="264" text-anchor="start" font-size="12" fill="#99A1B3" font-family="system-ui, sans-serif">it is a small fraction of the time, and the controller hides it</text>
<text x="250" y="294" text-anchor="end" font-size="12.5" fill="#F6F7F9" font-family="system-ui, sans-serif">when you would notice</text>
<text x="266" y="294" text-anchor="start" font-size="12" fill="#99A1B3" font-family="system-ui, sans-serif">in the heat: refresh is why idle RAM still draws power</text>
<text x="360" y="356" text-anchor="middle" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif">a memory chip spends part of its life just remembering what it already knew</text>
</svg>