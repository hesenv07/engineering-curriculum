<text x="540" y="282" text-anchor="middle" font-size="12.5" fill="#F6F7F9" font-family="system-ui, sans-serif">six transistors per bit</text>
<text x="360" y="344" text-anchor="middle" font-size="13.5" fill="#F6F7F9" font-family="system-ui, sans-serif">that ratio is why you have gigabytes of one and kilobytes of the other</text>
<text x="360" y="370" text-anchor="middle" font-size="12.5" fill="#99A1B3" font-family="system-ui, sans-serif">the DRAM cell was invented by Robert Dennard at IBM in 1966 — the same</text>
<text x="360" y="392" text-anchor="middle" font-size="12.5" fill="#99A1B3" font-family="system-ui, sans-serif">Dennard whose scaling rule gave computing thirty years of free speed</text>
