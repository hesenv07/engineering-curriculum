<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#F6F7F9"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#E06C60"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#149ECA"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#99A1B3"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-size="17" fill="#F6F7F9" font-family="system-ui, sans-serif">how memory gets fast without getting quick</text>
<text x="360" y="50" text-anchor="middle" font-size="12.5" fill="#99A1B3" font-family="system-ui, sans-serif">one access is slow, so do many at once</text>
<rect x="34.0" y="74.0" width="316.0" height="130.0" rx="11" fill="none" stroke="#149ECA" stroke-width="2"/>
<text x="192" y="98" text-anchor="middle" font-size="14" fill="#149ECA" font-family="system-ui, sans-serif" font-weight="bold">banks</text>
<rect x="52.0" y="112.0" width="62.0" height="32.0" rx="5" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="1.3"/>
<text x="83" y="133" text-anchor="middle" font-size="11" fill="#F6F7F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">b0</text>
<rect x="124.0" y="112.0" width="62.0" height="32.0" rx="5" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="1.3"/>
<text x="155" y="133" text-anchor="middle" font-size="11" fill="#F6F7F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">b1</text>
<rect x="196.0" y="112.0" width="62.0" height="32.0" rx="5" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="1.3"/>
<text x="227" y="133" text-anchor="middle" font-size="11" fill="#F6F7F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">b2</text>
<rect x="268.0" y="112.0" width="62.0" height="32.0" rx="5" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="1.3"/>
<text x="299" y="133" text-anchor="middle" font-size="11" fill="#F6F7F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">b3</text>
<rect x="52.0" y="154.0" width="62.0" height="32.0" rx="5" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="1.3"/>
<text x="83" y="175" text-anchor="middle" font-size="11" fill="#F6F7F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">b4</text>
<rect x="124.0" y="154.0" width="62.0" height="32.0" rx="5" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="1.3"/>
<text x="155" y="175" text-anchor="middle" font-size="11" fill="#F6F7F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">b5</text>
<rect x="196.0" y="154.0" width="62.0" height="32.0" rx="5" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="1.3"/>
<text x="227" y="175" text-anchor="middle" font-size="11" fill="#F6F7F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">b6</text>
<rect x="268.0" y="154.0" width="62.0" height="32.0" rx="5" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="1.3"/>
<text x="299" y="175" text-anchor="middle" font-size="11" fill="#F6F7F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">b7</text>
<text x="192" y="218" text-anchor="middle" font-size="11.5" fill="#99A1B3" font-family="system-ui, sans-serif">each has its own row buffer,</text>
<text x="192" y="234" text-anchor="middle" font-size="11.5" fill="#99A1B3" font-family="system-ui, sans-serif">so eight rows can be open at once</text>
<rect x="370.0" y="74.0" width="316.0" height="130.0" rx="11" fill="none" stroke="#E06C60" stroke-width="2"/>
<text x="528" y="98" text-anchor="middle" font-size="14" fill="#E06C60" font-family="system-ui, sans-serif" font-weight="bold">channels</text>
<rect x="400.0" y="112.0" width="132.0" height="62.0" rx="7" fill="#E06C60" fill-opacity="0.14" stroke="#E06C60" stroke-width="1.5"/>
<text x="466" y="148" text-anchor="middle" font-size="12.5" fill="#F6F7F9" font-family="system-ui, sans-serif">channel 0</text>
<rect x="552.0" y="112.0" width="132.0" height="62.0" rx="7" fill="#E06C60" fill-opacity="0.14" stroke="#E06C60" stroke-width="1.5"/>
<text x="618" y="148" text-anchor="middle" font-size="12.5" fill="#F6F7F9" font-family="system-ui, sans-serif">channel 1</text>
<text x="528" y="218" text-anchor="middle" font-size="11.5" fill="#99A1B3" font-family="system-ui, sans-serif">separate paths to the CPU —</text>
<text x="528" y="234" text-anchor="middle" font-size="11.5" fill="#99A1B3" font-family="system-ui, sans-serif">two channels, twice the bandwidth</text>
<rect x="96.0" y="260.0" width="528.0" height="84.0" rx="10" fill="none" stroke="#99A1B3" stroke-width="2"/>
<text x="360" y="284" text-anchor="middle" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif">so a single access still takes about 100 nanoseconds</text>
<text x="360" y="308" text-anchor="middle" font-size="13.5" fill="#149ECA" font-family="system-ui, sans-serif" font-weight="bold">but dozens of them can be in flight at the same time</text>
<text x="360" y="330" text-anchor="middle" font-size="12" fill="#99A1B3" font-family="system-ui, sans-serif">which is why bandwidth is measured in gigabytes per second</text>
<text x="360" y="380" text-anchor="middle" font-size="12.5" fill="#F6F7F9" font-family="system-ui, sans-serif">this is the same distinction as the pipelining lesson: latency is how long one</text>
<text x="360" y="402" text-anchor="middle" font-size="12.5" fill="#99A1B3" font-family="system-ui, sans-serif">thing takes, throughput is how many finish per second. memory improved one of them.</text>
</svg>