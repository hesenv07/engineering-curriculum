<text x="217" y="271" text-anchor="start" font-size="11" fill="#149ECA" font-family="system-ui, sans-serif">16 reads share one line</text>
<text x="299" y="226" text-anchor="start" font-size="11.5" fill="#E06C60" font-family="system-ui, sans-serif">one read per line</text>
<text x="411" y="115" text-anchor="start" font-size="11.5" fill="#99A1B3" font-family="system-ui, sans-serif">the prefetcher gives up</text>
<text x="360" y="348" text-anchor="middle" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif">3.15 ns at a 32-byte gap, 6.12 ns at 64 — the cost doubles exactly where</text>
<text x="360" y="370" text-anchor="middle" font-size="13" fill="#149ECA" font-family="system-ui, sans-serif">a second cache line becomes necessary for every access</text>
<text x="360" y="406" text-anchor="middle" font-size="12.5" fill="#99A1B3" font-family="system-ui, sans-serif">then a slow climb as the prefetcher, the row buffer and the address</text>
<text x="360" y="428" text-anchor="middle" font-size="12.5" fill="#99A1B3" font-family="system-ui, sans-serif">translation tables each run out of usefulness in turn</text>
