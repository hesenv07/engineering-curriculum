<text x="340" y="312" text-anchor="middle" font-size="12" fill="#087EA4" font-family="system-ui, sans-serif">written back into a register</text>
<text x="360" y="362" text-anchor="middle" font-size="13" fill="#23272F" font-family="system-ui, sans-serif">the wires never move — the multiplexers decide which value is allowed down which road</text>
