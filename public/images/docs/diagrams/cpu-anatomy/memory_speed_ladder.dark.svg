<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420"><defs><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#F6F7F9"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#E06C60"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#149ECA"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#99A1B3"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-size="17" fill="#F6F7F9" font-family="system-ui, sans-serif">why registers exist</text>
<text x="360" y="48" text-anchor="middle" font-size="12" fill="#99A1B3" font-family="system-ui, sans-serif">one CPU cycle at 3 GHz is 0.33 ns — now scale it so that a register takes one second</text>
<text x="152" y="101" text-anchor="end" font-size="14" fill="#F6F7F9" font-family="system-ui, sans-serif">register</text>
<rect x="166" y="84" width="6" height="24" rx="5" fill="#149ECA" fill-opacity="0.22" stroke="#149ECA" stroke-width="2"/>
<text x="566" y="101" text-anchor="end" font-size="12" fill="#99A1B3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1 cycle</text>
<text x="580" y="101" text-anchor="start" font-size="13" fill="#149ECA" font-family="system-ui, sans-serif">1 second</text>
<text x="152" y="145" text-anchor="end" font-size="14" fill="#F6F7F9" font-family="system-ui, sans-serif">L1 cache</text>
<rect x="166" y="128" width="14" height="24" rx="5" fill="#149ECA" fill-opacity="0.22" stroke="#149ECA" stroke-width="2"/>
<text x="566" y="145" text-anchor="end" font-size="12" fill="#99A1B3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4 cycles</text>
<text x="580" y="145" text-anchor="start" font-size="13" fill="#149ECA" font-family="system-ui, sans-serif">4 seconds</text>
<text x="152" y="189" text-anchor="end" font-size="14" fill="#F6F7F9" font-family="system-ui, sans-serif">L2 cache</text>
<rect x="166" y="172" width="28" height="24" rx="5" fill="#149ECA" fill-opacity="0.22" stroke="#149ECA" stroke-width="2"/>
<text x="566" y="189" text-anchor="end" font-size="12" fill="#99A1B3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">12 cycles</text>
<text x="580" y="189" text-anchor="start" font-size="13" fill="#149ECA" font-family="system-ui, sans-serif">12 seconds</text>
<text x="152" y="233" text-anchor="end" font-size="14" fill="#F6F7F9" font-family="system-ui, sans-serif">L3 cache</text>
<rect x="166" y="216" width="60" height="24" rx="5" fill="#99A1B3" fill-opacity="0.22" stroke="#99A1B3" stroke-width="2"/>
<text x="566" y="233" text-anchor="end" font-size="12" fill="#99A1B3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">40 cycles</text>
<text x="580" y="233" text-anchor="start" font-size="13" fill="#99A1B3" font-family="system-ui, sans-serif">40 seconds</text>
<text x="152" y="277" text-anchor="end" font-size="14" fill="#F6F7F9" font-family="system-ui, sans-serif">main memory</text>
<rect x="166" y="260" width="120" height="24" rx="5" fill="#E06C60" fill-opacity="0.22" stroke="#E06C60" stroke-width="2"/>
<text x="566" y="277" text-anchor="end" font-size="12" fill="#99A1B3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">~200 cycles</text>
<text x="580" y="277" text-anchor="start" font-size="13" fill="#E06C60" font-family="system-ui, sans-serif">3 minutes</text>
<text x="152" y="321" text-anchor="end" font-size="14" fill="#F6F7F9" font-family="system-ui, sans-serif">SSD</text>
<rect x="166" y="304" width="240" height="24" rx="5" fill="#E06C60" fill-opacity="0.22" stroke="#E06C60" stroke-width="2"/>
<text x="566" y="321" text-anchor="end" font-size="12" fill="#99A1B3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">~300,000 cycles</text>
<text x="580" y="321" text-anchor="start" font-size="13" fill="#E06C60" font-family="system-ui, sans-serif">3.5 days</text>
<text x="152" y="365" text-anchor="end" font-size="14" fill="#F6F7F9" font-family="system-ui, sans-serif">hard disk seek</text>
<rect x="166" y="348" width="380" height="24" rx="5" fill="#E06C60" fill-opacity="0.22" stroke="#E06C60" stroke-width="2"/>
<text x="566" y="365" text-anchor="end" font-size="12" fill="#99A1B3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">~30,000,000 cycles</text>
<text x="580" y="365" text-anchor="start" font-size="13" fill="#E06C60" font-family="system-ui, sans-serif">almost a year</text>
<text x="360" y="400" text-anchor="middle" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif">a register is not a small optimisation — it is a different world from memory</text>
</svg>