<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#F6F7F9"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#E06C60"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#149ECA"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#99A1B3"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-size="17" fill="#F6F7F9" font-family="system-ui, sans-serif">why three caches instead of one</text>
<rect x="42.0" y="60.0" width="70.0" height="52.0" rx="9" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="2"/>
<text x="85" y="91" text-anchor="middle" font-size="13" fill="#149ECA" font-family="system-ui, sans-serif" font-weight="bold">registers</text>
<text x="128" y="82" text-anchor="start" font-size="12" fill="#F6F7F9" font-family="system-ui, sans-serif">a few hundred bytes</text>
<text x="128" y="100" text-anchor="start" font-size="11.5" fill="#99A1B3" font-family="system-ui, sans-serif">1 cycle</text>
<rect x="42.0" y="124.0" width="130.0" height="52.0" rx="9" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="2"/>
<text x="110" y="155" text-anchor="middle" font-size="13" fill="#149ECA" font-family="system-ui, sans-serif" font-weight="bold">L1</text>
<text x="188" y="146" text-anchor="start" font-size="12" fill="#F6F7F9" font-family="system-ui, sans-serif">32 KB</text>
<text x="188" y="164" text-anchor="start" font-size="11.5" fill="#99A1B3" font-family="system-ui, sans-serif">~4 cycles</text>
<rect x="42.0" y="188.0" width="230.0" height="52.0" rx="9" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="2"/>
<text x="110" y="219" text-anchor="middle" font-size="13" fill="#149ECA" font-family="system-ui, sans-serif" font-weight="bold">L2</text>
<text x="288" y="210" text-anchor="start" font-size="12" fill="#F6F7F9" font-family="system-ui, sans-serif">1 MB</text>
<text x="288" y="228" text-anchor="start" font-size="11.5" fill="#99A1B3" font-family="system-ui, sans-serif">~12 cycles</text>
<rect x="42.0" y="252.0" width="380.0" height="52.0" rx="9" fill="#99A1B3" fill-opacity="0.14" stroke="#99A1B3" stroke-width="2"/>
<text x="110" y="283" text-anchor="middle" font-size="13" fill="#99A1B3" font-family="system-ui, sans-serif" font-weight="bold">L3</text>
<text x="438" y="274" text-anchor="start" font-size="12" fill="#F6F7F9" font-family="system-ui, sans-serif">33 MB</text>
<text x="438" y="292" text-anchor="start" font-size="11.5" fill="#99A1B3" font-family="system-ui, sans-serif">~40 cycles</text>
<rect x="42.0" y="316.0" width="560.0" height="52.0" rx="9" fill="#E06C60" fill-opacity="0.14" stroke="#E06C60" stroke-width="2"/>
<text x="110" y="347" text-anchor="middle" font-size="13" fill="#E06C60" font-family="system-ui, sans-serif" font-weight="bold">main memory</text>
<text x="618" y="338" text-anchor="start" font-size="12" fill="#F6F7F9" font-family="system-ui, sans-serif">16 GB</text>
<text x="618" y="356" text-anchor="start" font-size="11.5" fill="#99A1B3" font-family="system-ui, sans-serif">~400 cycles</text>
<text x="360" y="396" text-anchor="middle" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif">a cache can be small and fast, or big and slow — never both, because</text>
<text x="360" y="420" text-anchor="middle" font-size="12.5" fill="#99A1B3" font-family="system-ui, sans-serif">finding something in a bigger store takes longer and sits further from the core</text>
<text x="360" y="448" text-anchor="middle" font-size="13" fill="#149ECA" font-family="system-ui, sans-serif">so build several, and let each one catch what the one above it missed</text>
</svg>