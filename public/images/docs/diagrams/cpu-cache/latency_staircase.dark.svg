<text x="289" y="307" text-anchor="middle" font-size="13" fill="#149ECA" font-family="system-ui, sans-serif">walking in order</text>
<text x="121" y="291" text-anchor="middle" font-size="11" fill="#E06C60" font-family="system-ui, sans-serif">1.5 ns</text>
<text x="360" y="372" text-anchor="middle" font-size="12.5" fill="#F6F7F9" font-family="system-ui, sans-serif">the red line is the real cost of memory: 1.5 ns when it fits in L1, 156 ns when it does not.</text>
<text x="360" y="396" text-anchor="middle" font-size="12.5" fill="#149ECA" font-family="system-ui, sans-serif">the blue line is the same machine reading the same amount of data — in order.</text>
<text x="360" y="424" text-anchor="middle" font-size="12.5" fill="#99A1B3" font-family="system-ui, sans-serif">your data size decides which caches can hold it.</text>
<text x="360" y="446" text-anchor="middle" font-size="13.5" fill="#F6F7F9" font-family="system-ui, sans-serif" font-weight="bold">your access pattern decides whether that matters.</text>
