<text x="360" y="26" text-anchor="middle" font-size="17" fill="#23272F" font-family="system-ui, sans-serif">you asked for one byte. you got sixty-four.</text>
<text x="360" y="56" text-anchor="middle" font-size="15" fill="#23272F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">int x = data[0];</text>
<text x="360" y="78" text-anchor="middle" font-size="12" fill="#99A1B3" font-family="system-ui, sans-serif">your program wants 4 bytes</text>
