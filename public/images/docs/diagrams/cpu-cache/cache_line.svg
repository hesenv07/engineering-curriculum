<text x="360" y="186" text-anchor="middle" font-size="13" fill="#23272F" font-family="system-ui, sans-serif">but memory is only ever moved in 64-byte blocks called cache lines</text>
<text x="64" y="108" text-anchor="middle" font-size="11" fill="#087EA4" font-family="system-ui, sans-serif">wanted</text>
<text x="420" y="108" text-anchor="middle" font-size="11" fill="#99A1B3" font-family="system-ui, sans-serif">came along for free</text>
<rect x="44.0" y="210.0" width="632.0" height="44.0" rx="9" fill="#C1554D" fill-opacity="0.14" stroke="#C1554D" stroke-width="2"/>
<text x="360" y="238" text-anchor="middle" font-size="13" fill="#23272F" font-family="system-ui, sans-serif">one 64-byte cache line — the smallest thing a cache can hold or move</text>
<text x="360" y="292" text-anchor="middle" font-size="13" fill="#23272F" font-family="system-ui, sans-serif">this is why walking an array in order is so fast: the first access pays for</text>
<text x="360" y="314" text-anchor="middle" font-size="13" fill="#087EA4" font-family="system-ui, sans-serif">the trip, and the next fifteen are already sitting in the cache</text>
<text x="360" y="356" text-anchor="middle" font-size="12.5" fill="#99A1B3" font-family="system-ui, sans-serif">and why jumping around is so slow: every jump pays full price for 64 bytes,</text>
<text x="360" y="378" text-anchor="middle" font-size="12.5" fill="#C1554D" font-family="system-ui, sans-serif">and then throws away the 60 it did not want</text>
</svg>