<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#23272F"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#C1554D"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#087EA4"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#99A1B3"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-size="17" fill="#23272F" font-family="system-ui, sans-serif">the same SSD, read two ways</text>
<text x="360" y="56" text-anchor="middle" font-size="12" fill="#99A1B3" font-family="system-ui, sans-serif">measured on this machine</text>
<text x="250" y="108" text-anchor="end" font-size="13" fill="#087EA4" font-family="system-ui, sans-serif">reading straight through</text>
<rect x="262.0" y="90.0" width="388.0" height="30.0" rx="6" fill="#087EA4" fill-opacity="0.14" stroke="#087EA4" stroke-width="1.6"/>
<text x="660" y="110" text-anchor="end" font-size="13" fill="#087EA4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2,039 MB/s</text>
<text x="250" y="168" text-anchor="end" font-size="13" fill="#C1554D" font-family="system-ui, sans-serif">random 4 KB reads</text>
<rect x="262.0" y="150.0" width="11.0" height="30.0" rx="4" fill="#C1554D" fill-opacity="0.14" stroke="#C1554D" stroke-width="1.6"/>
<text x="284" y="170" text-anchor="start" font-size="13" fill="#C1554D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">56 MB/s</text>
<text x="360" y="216" text-anchor="middle" font-size="13.5" fill="#C1554D" font-family="system-ui, sans-serif" font-weight="bold">37 times less useful data per second, from the same device</text>
<rect x="90.0" y="244.0" width="540.0" height="74.0" rx="10" fill="none" stroke="#99A1B3" stroke-width="2"/>
<text x="360" y="268" text-anchor="middle" font-size="12.5" fill="#23272F" font-family="system-ui, sans-serif">why: a device answers requests, and each request has a fixed cost</text>
<text x="360" y="290" text-anchor="middle" font-size="12" fill="#99A1B3" font-family="system-ui, sans-serif">one big request moves a lot per cost. a thousand tiny scattered requests</text>
<text x="360" y="308" text-anchor="middle" font-size="12" fill="#99A1B3" font-family="system-ui, sans-serif">pay that cost a thousand times and move almost nothing.</text>
<text x="360" y="352" text-anchor="middle" font-size="13" fill="#087EA4" font-family="system-ui, sans-serif">you have met this exact shape before: it is the cache line argument, one floor down</text>
</svg>