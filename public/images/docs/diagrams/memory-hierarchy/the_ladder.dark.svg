<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 546"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#F6F7F9"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#E06C60"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#149ECA"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#99A1B3"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-size="17" fill="#F6F7F9" font-family="system-ui, sans-serif">everywhere a computer can keep a byte</text>
<text x="360" y="48" text-anchor="middle" font-size="12" fill="#99A1B3" font-family="system-ui, sans-serif">wider means it holds more · further down means it answers slower</text>
<rect x="40.0" y="70.0" width="90.0" height="44.0" rx="8" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="2"/>
<text x="54" y="98" text-anchor="start" font-size="13" fill="#149ECA" font-family="system-ui, sans-serif" font-weight="bold">registers</text>
<text x="146" y="90" text-anchor="start" font-size="12" fill="#F6F7F9" font-family="system-ui, sans-serif">~1 KB</text>
<text x="146" y="107" text-anchor="start" font-size="11.5" fill="#99A1B3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0.4 ns</text>
<rect x="40.0" y="122.0" width="130.0" height="44.0" rx="8" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="2"/>
<text x="54" y="150" text-anchor="start" font-size="13" fill="#149ECA" font-family="system-ui, sans-serif" font-weight="bold">L1 cache</text>
<text x="186" y="142" text-anchor="start" font-size="12" fill="#F6F7F9" font-family="system-ui, sans-serif">32 KB</text>
<text x="186" y="159" text-anchor="start" font-size="11.5" fill="#99A1B3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1.5 ns</text>
<rect x="40.0" y="174.0" width="180.0" height="44.0" rx="8" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="2"/>
<text x="54" y="202" text-anchor="start" font-size="13" fill="#149ECA" font-family="system-ui, sans-serif" font-weight="bold">L2 cache</text>
<text x="236" y="194" text-anchor="start" font-size="12" fill="#F6F7F9" font-family="system-ui, sans-serif">1 MB</text>
<text x="236" y="211" text-anchor="start" font-size="11.5" fill="#99A1B3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4.1 ns</text>
<rect x="40.0" y="226.0" width="240.0" height="44.0" rx="8" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="2"/>
<text x="54" y="254" text-anchor="start" font-size="13" fill="#149ECA" font-family="system-ui, sans-serif" font-weight="bold">L3 cache</text>
<text x="296" y="246" text-anchor="start" font-size="12" fill="#F6F7F9" font-family="system-ui, sans-serif">33 MB</text>
<text x="296" y="263" text-anchor="start" font-size="11.5" fill="#99A1B3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">28 ns</text>
<rect x="40.0" y="278.0" width="330.0" height="44.0" rx="8" fill="#F6F7F9" fill-opacity="0.14" stroke="#F6F7F9" stroke-width="2"/>
<text x="54" y="306" text-anchor="start" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif" font-weight="bold">main memory</text>
<text x="386" y="298" text-anchor="start" font-size="12" fill="#F6F7F9" font-family="system-ui, sans-serif">16 GB</text>
<text x="386" y="315" text-anchor="start" font-size="11.5" fill="#99A1B3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">156 ns</text>
<rect x="40.0" y="330.0" width="410.0" height="44.0" rx="8" fill="#E06C60" fill-opacity="0.14" stroke="#E06C60" stroke-width="2"/>
<text x="54" y="358" text-anchor="start" font-size="13" fill="#E06C60" font-family="system-ui, sans-serif" font-weight="bold">SSD</text>
<text x="466" y="350" text-anchor="start" font-size="12" fill="#F6F7F9" font-family="system-ui, sans-serif">1 TB</text>
<text x="466" y="367" text-anchor="start" font-size="11.5" fill="#99A1B3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">74 µs</text>
<rect x="40.0" y="382.0" width="490.0" height="44.0" rx="8" fill="#E06C60" fill-opacity="0.14" stroke="#E06C60" stroke-width="2"/>
<text x="54" y="410" text-anchor="start" font-size="13" fill="#E06C60" font-family="system-ui, sans-serif" font-weight="bold">hard disk</text>
<text x="546" y="402" text-anchor="start" font-size="12" fill="#F6F7F9" font-family="system-ui, sans-serif">8 TB</text>
<text x="546" y="419" text-anchor="start" font-size="11.5" fill="#99A1B3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">10 ms</text>
<rect x="40.0" y="434.0" width="560.0" height="44.0" rx="8" fill="#E06C60" fill-opacity="0.14" stroke="#E06C60" stroke-width="2"/>
<text x="54" y="462" text-anchor="start" font-size="13" fill="#E06C60" font-family="system-ui, sans-serif" font-weight="bold">another city</text>
<text x="616" y="454" text-anchor="start" font-size="12" fill="#F6F7F9" font-family="system-ui, sans-serif">no limit</text>
<text x="616" y="471" text-anchor="start" font-size="11.5" fill="#99A1B3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">14 ms</text>
<path d="M 700.0 78.0 L 700.0 468.0" fill="none" stroke="#99A1B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g)"/>
<text x="690" y="270" text-anchor="end" font-size="12" fill="#99A1B3" font-family="system-ui, sans-serif">slower</text>
<text x="360" y="508" text-anchor="middle" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif">top to bottom: about 34 million times slower, and about a billion times bigger</text>
<text x="360" y="534" text-anchor="middle" font-size="11.5" fill="#99A1B3" font-family="system-ui, sans-serif">every figure above the dashed part was measured on the machine that built this page</text>
</svg>