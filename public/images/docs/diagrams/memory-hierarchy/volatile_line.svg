<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#23272F"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#C1554D"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#087EA4"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#99A1B3"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-size="17" fill="#23272F" font-family="system-ui, sans-serif">the line where the power switch matters</text>
<rect x="120.0" y="58.0" width="480.0" height="40.0" rx="8" fill="#087EA4" fill-opacity="0.14" stroke="#087EA4" stroke-width="2"/>
<text x="360" y="84" text-anchor="middle" font-size="13" fill="#23272F" font-family="system-ui, sans-serif">registers</text>
<rect x="120.0" y="106.0" width="480.0" height="40.0" rx="8" fill="#087EA4" fill-opacity="0.14" stroke="#087EA4" stroke-width="2"/>
<text x="360" y="132" text-anchor="middle" font-size="13" fill="#23272F" font-family="system-ui, sans-serif">L1 / L2 / L3 cache</text>
<rect x="120.0" y="154.0" width="480.0" height="40.0" rx="8" fill="#087EA4" fill-opacity="0.14" stroke="#087EA4" stroke-width="2"/>
<text x="360" y="180" text-anchor="middle" font-size="13" fill="#23272F" font-family="system-ui, sans-serif">main memory (RAM)</text>
<path d="M 60.0 208.0 L 660.0 208.0" fill="none" stroke="#C1554D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 6"/>
<text x="360" y="196" text-anchor="middle" font-size="13.5" fill="#C1554D" font-family="system-ui, sans-serif" font-weight="bold">pull the plug here</text>
<text x="360" y="230" text-anchor="middle" font-size="12.5" fill="#C1554D" font-family="system-ui, sans-serif">everything above is gone. everything below survives.</text>
<rect x="120.0" y="252.0" width="480.0" height="38.0" rx="8" fill="none" stroke="#99A1B3" stroke-width="2"/>
<text x="360" y="277" text-anchor="middle" font-size="13" fill="#23272F" font-family="system-ui, sans-serif">SSD</text>
<rect x="120.0" y="296.0" width="480.0" height="38.0" rx="8" fill="none" stroke="#99A1B3" stroke-width="2"/>
<text x="360" y="321" text-anchor="middle" font-size="13" fill="#23272F" font-family="system-ui, sans-serif">hard disk</text>
<rect x="120.0" y="340.0" width="480.0" height="38.0" rx="8" fill="none" stroke="#99A1B3" stroke-width="2"/>
<text x="360" y="365" text-anchor="middle" font-size="13" fill="#23272F" font-family="system-ui, sans-serif">another machine's disk</text>
<rect x="120.0" y="384.0" width="480.0" height="38.0" rx="8" fill="none" stroke="#99A1B3" stroke-width="2"/>
<text x="360" y="409" text-anchor="middle" font-size="13" fill="#23272F" font-family="system-ui, sans-serif">tape in a vault</text>
<text x="66" y="100" text-anchor="start" font-size="13.5" fill="#087EA4" font-family="system-ui, sans-serif" font-weight="bold">volatile</text>
<text x="66" y="118" text-anchor="start" font-size="11" fill="#99A1B3" font-family="system-ui, sans-serif">needs power</text>
<text x="66" y="308" text-anchor="start" font-size="13.5" fill="#99A1B3" font-family="system-ui, sans-serif" font-weight="bold">persistent</text>
<text x="66" y="326" text-anchor="start" font-size="11" fill="#99A1B3" font-family="system-ui, sans-serif">keeps its</text>
<text x="66" y="340" text-anchor="start" font-size="11" fill="#99A1B3" font-family="system-ui, sans-serif">contents</text>
<text x="360" y="462" text-anchor="middle" font-size="13" fill="#23272F" font-family="system-ui, sans-serif">the fast half of the hierarchy forgets. that is the deal you get for the speed.</text>
</svg>