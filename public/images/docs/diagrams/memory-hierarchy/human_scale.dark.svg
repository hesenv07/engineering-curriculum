<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 506"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#F6F7F9"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#E06C60"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#149ECA"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#99A1B3"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-size="17" fill="#F6F7F9" font-family="system-ui, sans-serif">the same ladder, in units a person can feel</text>
<text x="360" y="50" text-anchor="middle" font-size="12.5" fill="#99A1B3" font-family="system-ui, sans-serif">suppose one CPU cycle took one second. then…</text>
<rect x="44.0" y="74.0" width="632.0" height="40.0" rx="8" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="2"/>
<text x="64" y="100" text-anchor="start" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif">one CPU cycle</text>
<text x="656" y="100" text-anchor="end" font-size="14" fill="#149ECA" font-family="system-ui, sans-serif" font-weight="bold">1 second</text>
<rect x="44.0" y="120.0" width="632.0" height="40.0" rx="8" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="2"/>
<text x="64" y="146" text-anchor="start" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif">L1 cache</text>
<text x="656" y="146" text-anchor="end" font-size="14" fill="#149ECA" font-family="system-ui, sans-serif" font-weight="bold">4 seconds</text>
<rect x="44.0" y="166.0" width="632.0" height="40.0" rx="8" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="2"/>
<text x="64" y="192" text-anchor="start" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif">L2 cache</text>
<text x="656" y="192" text-anchor="end" font-size="14" fill="#149ECA" font-family="system-ui, sans-serif" font-weight="bold">11 seconds</text>
<rect x="44.0" y="212.0" width="632.0" height="40.0" rx="8" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="2"/>
<text x="64" y="238" text-anchor="start" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif">L3 cache</text>
<text x="656" y="238" text-anchor="end" font-size="14" fill="#149ECA" font-family="system-ui, sans-serif" font-weight="bold">just over a minute</text>
<rect x="44.0" y="258.0" width="632.0" height="40.0" rx="8" fill="#F6F7F9" fill-opacity="0.14" stroke="#F6F7F9" stroke-width="2"/>
<text x="64" y="284" text-anchor="start" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif">main memory</text>
<text x="656" y="284" text-anchor="end" font-size="14" fill="#F6F7F9" font-family="system-ui, sans-serif" font-weight="bold">7 minutes</text>
<rect x="44.0" y="304.0" width="632.0" height="40.0" rx="8" fill="#E06C60" fill-opacity="0.14" stroke="#E06C60" stroke-width="2"/>
<text x="64" y="330" text-anchor="start" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif">SSD, random read</text>
<text x="656" y="330" text-anchor="end" font-size="14" fill="#E06C60" font-family="system-ui, sans-serif" font-weight="bold">2 days</text>
<rect x="44.0" y="350.0" width="632.0" height="40.0" rx="8" fill="#E06C60" fill-opacity="0.14" stroke="#E06C60" stroke-width="2"/>
<text x="64" y="376" text-anchor="start" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif">hard disk seek</text>
<text x="656" y="376" text-anchor="end" font-size="14" fill="#E06C60" font-family="system-ui, sans-serif" font-weight="bold">11 months</text>
<rect x="44.0" y="396.0" width="632.0" height="40.0" rx="8" fill="#E06C60" fill-opacity="0.14" stroke="#E06C60" stroke-width="2"/>
<text x="64" y="422" text-anchor="start" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif">a server on another continent</text>
<text x="656" y="422" text-anchor="end" font-size="14" fill="#E06C60" font-family="system-ui, sans-serif" font-weight="bold">13 years</text>
<text x="360" y="466" text-anchor="middle" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif">a cache miss is a coffee break. a disk seek is a season. a request across the world</text>
<text x="360" y="492" text-anchor="middle" font-size="12.5" fill="#99A1B3" font-family="system-ui, sans-serif">is a career. this is why programs wait, and why waiting is what you optimise.</text>
</svg>