<text x="636" y="212" text-anchor="middle" font-size="13" fill="#F6F7F9">finite state</text>
<text x="636" y="230" text-anchor="middle" font-size="13" fill="#F6F7F9">→ it repeats</text>
<text x="636" y="300" text-anchor="middle" font-size="12" fill="#99A1B3">the period</text>
<text x="300" y="318" text-anchor="middle" font-size="13" fill="#99A1B3">same seed → same stream, on every machine, forever</text>
