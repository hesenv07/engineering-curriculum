<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#F6F7F9"/></marker><marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#99A1B3"/></marker></defs>
<text x="360" y="28" text-anchor="middle" font-size="16" fill="#F6F7F9">a deterministic machine pretending to be surprised</text>
<rect x="24" y="74" width="132" height="58" rx="9" fill="#149ECA" fill-opacity="0.12" stroke="#149ECA" stroke-width="2"/>
<text x="90" y="98" text-anchor="middle" font-size="13" fill="#149ECA">seed</text>
<text x="90" y="120" text-anchor="middle" font-size="17" fill="#F6F7F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1337</text>
<text x="90" y="152" text-anchor="middle" font-size="12" fill="#99A1B3">the only input</text>
<rect x="226" y="74" width="150" height="58" rx="9" fill="none" stroke="#F6F7F9" stroke-width="2"/>
<text x="301" y="98" text-anchor="middle" font-size="13" fill="#99A1B3">internal state</text>
<text x="301" y="120" text-anchor="middle" font-size="17" fill="#F6F7F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">s</text>
<rect x="226" y="186" width="150" height="54" rx="9" fill="#E06C60" fill-opacity="0.12" stroke="#E06C60" stroke-width="2"/>
<text x="301" y="218" text-anchor="middle" font-size="15" fill="#F6F7F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">s = (a·s + c) mod m</text>
<text x="301" y="260" text-anchor="middle" font-size="12" fill="#99A1B3">multiply, add, wrap —</text>
<text x="301" y="277" text-anchor="middle" font-size="12" fill="#99A1B3">the odometer, again</text>
<rect x="446" y="74" width="150" height="58" rx="9" fill="#149ECA" fill-opacity="0.12" stroke="#149ECA" stroke-width="2"/>
<text x="521" y="98" text-anchor="middle" font-size="13" fill="#149ECA">output</text>
<text x="521" y="120" text-anchor="middle" font-size="17" fill="#F6F7F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4, 1, 6, 5, …</text>
