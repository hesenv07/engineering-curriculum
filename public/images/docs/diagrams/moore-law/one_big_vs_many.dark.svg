<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#F6F7F9"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#E06C60"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#149ECA"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#99A1B3"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-size="17" fill="#F6F7F9" font-family="system-ui, sans-serif">the same silicon, spent two ways</text>
<rect x="50.0" y="62.0" width="280.0" height="200.0" rx="12" fill="none" stroke="#99A1B3" stroke-width="2" stroke-dasharray="5 4"/>
<text x="190" y="52" text-anchor="middle" font-size="14" fill="#E06C60" font-family="system-ui, sans-serif">one enormous core</text>
<rect x="72.0" y="84.0" width="236.0" height="156.0" rx="10" fill="#E06C60" fill-opacity="0.14" stroke="#E06C60" stroke-width="2"/>
<text x="190" y="150" text-anchor="middle" font-size="22" fill="#F6F7F9" font-family="system-ui, sans-serif">1 core</text>
<text x="190" y="176" text-anchor="middle" font-size="11.5" fill="#99A1B3" font-family="system-ui, sans-serif">deeper pipeline, wider issue,</text>
<text x="190" y="194" text-anchor="middle" font-size="11.5" fill="#99A1B3" font-family="system-ui, sans-serif">cleverer prediction</text>
<text x="190" y="288" text-anchor="middle" font-size="12.5" fill="#E06C60" font-family="system-ui, sans-serif">diminishing returns:</text>
<text x="190" y="308" text-anchor="middle" font-size="12" fill="#99A1B3" font-family="system-ui, sans-serif">twice the transistors bought</text>
<text x="190" y="326" text-anchor="middle" font-size="12" fill="#99A1B3" font-family="system-ui, sans-serif">maybe 40% more speed</text>
<rect x="390.0" y="62.0" width="280.0" height="200.0" rx="12" fill="none" stroke="#99A1B3" stroke-width="2" stroke-dasharray="5 4"/>
<text x="530" y="52" text-anchor="middle" font-size="14" fill="#149ECA" font-family="system-ui, sans-serif">four modest cores</text>
<rect x="412.0" y="84.0" width="108.0" height="70.0" rx="8" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="2"/>
<text x="466" y="125" text-anchor="middle" font-size="14" fill="#F6F7F9" font-family="system-ui, sans-serif">core 1</text>
<rect x="530.0" y="84.0" width="108.0" height="70.0" rx="8" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="2"/>
<text x="584" y="125" text-anchor="middle" font-size="14" fill="#F6F7F9" font-family="system-ui, sans-serif">core 2</text>
<rect x="412.0" y="164.0" width="108.0" height="70.0" rx="8" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="2"/>
<text x="466" y="205" text-anchor="middle" font-size="14" fill="#F6F7F9" font-family="system-ui, sans-serif">core 3</text>
<rect x="530.0" y="164.0" width="108.0" height="70.0" rx="8" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="2"/>
<text x="584" y="205" text-anchor="middle" font-size="14" fill="#F6F7F9" font-family="system-ui, sans-serif">core 4</text>
<text x="530" y="288" text-anchor="middle" font-size="12.5" fill="#149ECA" font-family="system-ui, sans-serif">linear returns — if, and only if,</text>
<text x="530" y="308" text-anchor="middle" font-size="12" fill="#99A1B3" font-family="system-ui, sans-serif">the software can keep all four busy.</text>
<text x="530" y="326" text-anchor="middle" font-size="12" fill="#99A1B3" font-family="system-ui, sans-serif">that “if” is now the programmer's problem.</text>
<text x="360" y="366" text-anchor="middle" font-size="13.5" fill="#F6F7F9" font-family="system-ui, sans-serif">in 2005 the industry stopped buying speed and started buying cores</text>
</svg>