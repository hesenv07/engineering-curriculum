<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#F6F7F9"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#E06C60"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#149ECA"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#99A1B3"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-size="17" fill="#F6F7F9" font-family="system-ui, sans-serif">the free lunch, and exactly why it was free</text>
<rect x="34.0" y="66.0" width="148.0" height="96.0" rx="10" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="2"/>
<text x="108" y="96" text-anchor="middle" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif">shrink the</text>
<text x="108" y="116" text-anchor="middle" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif">transistor</text>
<text x="108" y="146" text-anchor="middle" font-size="11" fill="#99A1B3" font-family="system-ui, sans-serif">30% smaller</text>
<path d="M 185.0 114.0 L 200.0 114.0" fill="none" stroke="#99A1B3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g)"/>
<rect x="204.0" y="66.0" width="148.0" height="96.0" rx="10" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="2"/>
<text x="278" y="96" text-anchor="middle" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif">it switches</text>
<text x="278" y="116" text-anchor="middle" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif">faster</text>
<text x="278" y="146" text-anchor="middle" font-size="11" fill="#99A1B3" font-family="system-ui, sans-serif">clock can rise</text>
<path d="M 355.0 114.0 L 370.0 114.0" fill="none" stroke="#99A1B3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g)"/>
<rect x="374.0" y="66.0" width="148.0" height="96.0" rx="10" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="2"/>
<text x="448" y="96" text-anchor="middle" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif">it needs less</text>
<text x="448" y="116" text-anchor="middle" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif">voltage</text>
<text x="448" y="146" text-anchor="middle" font-size="11" fill="#99A1B3" font-family="system-ui, sans-serif">V drops too</text>
<path d="M 525.0 114.0 L 540.0 114.0" fill="none" stroke="#99A1B3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g)"/>
<rect x="544.0" y="66.0" width="148.0" height="96.0" rx="10" fill="#F6F7F9" fill-opacity="0.14" stroke="#F6F7F9" stroke-width="2"/>
<text x="618" y="96" text-anchor="middle" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif">power per area</text>
<text x="618" y="116" text-anchor="middle" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif">stays the same</text>
<text x="618" y="146" text-anchor="middle" font-size="11" fill="#99A1B3" font-family="system-ui, sans-serif">nothing gets hotter</text>
<rect x="120.0" y="194.0" width="480.0" height="76.0" rx="11" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="2"/>
<text x="360" y="220" text-anchor="middle" font-size="20" fill="#F6F7F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">P = C · V² · f</text>
<text x="360" y="248" text-anchor="middle" font-size="12.5" fill="#149ECA" font-family="system-ui, sans-serif">C down 30%, V down 30%, f up 40%   →   power actually FELL to 0.48×</text>
<text x="360" y="306" text-anchor="middle" font-size="13.5" fill="#F6F7F9" font-family="system-ui, sans-serif">every new generation was smaller, faster AND cooler at the same time</text>
<text x="360" y="330" text-anchor="middle" font-size="13" fill="#99A1B3" font-family="system-ui, sans-serif">software got faster every year while nobody changed a line of it</text>
<text x="360" y="366" text-anchor="middle" font-size="12.5" fill="#E06C60" font-family="system-ui, sans-serif">this is Dennard scaling, described in 1974 — and it is the thing that ended, not Moore's law</text>
</svg>