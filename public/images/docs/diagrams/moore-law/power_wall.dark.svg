<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#F6F7F9"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#E06C60"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#149ECA"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#99A1B3"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-size="17" fill="#F6F7F9" font-family="system-ui, sans-serif">why the clock stopped: voltage refused to shrink</text>
<text x="360" y="58" text-anchor="middle" font-size="22" fill="#F6F7F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">P = C · V² · f</text>
<text x="360" y="82" text-anchor="middle" font-size="12" fill="#99A1B3" font-family="system-ui, sans-serif">power depends on the SQUARE of voltage, but only linearly on frequency</text>
<text x="254" y="137" text-anchor="end" font-size="12.5" fill="#F6F7F9" font-family="system-ui, sans-serif">same clock, same V</text>
<rect x="266.0" y="116.0" width="78.0" height="30.0" rx="6" fill="#99A1B3" fill-opacity="0.22" stroke="#99A1B3" stroke-width="1.6"/>
<text x="354" y="137" text-anchor="start" font-size="13" fill="#99A1B3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1.00×</text>
<text x="266" y="164" text-anchor="start" font-size="11.5" fill="#99A1B3" font-family="system-ui, sans-serif">baseline</text>
<text x="254" y="203" text-anchor="end" font-size="12.5" fill="#F6F7F9" font-family="system-ui, sans-serif">2× clock, same V</text>
<rect x="266.0" y="182.0" width="156.0" height="30.0" rx="6" fill="#149ECA" fill-opacity="0.22" stroke="#149ECA" stroke-width="1.6"/>
<text x="432" y="203" text-anchor="start" font-size="13" fill="#149ECA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2.00×</text>
<text x="266" y="230" text-anchor="start" font-size="11.5" fill="#99A1B3" font-family="system-ui, sans-serif">2× power — fine, if V could stay</text>
<text x="254" y="269" text-anchor="end" font-size="12.5" fill="#F6F7F9" font-family="system-ui, sans-serif">2× clock, V ×1.3</text>
<rect x="266.0" y="248.0" width="263.6" height="30.0" rx="6" fill="#E06C60" fill-opacity="0.22" stroke="#E06C60" stroke-width="1.6"/>
<text x="540" y="269" text-anchor="start" font-size="13" fill="#E06C60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3.38×</text>
<text x="266" y="296" text-anchor="start" font-size="11.5" fill="#99A1B3" font-family="system-ui, sans-serif">3.4× power — this is the wall</text>
<text x="254" y="335" text-anchor="end" font-size="12.5" fill="#F6F7F9" font-family="system-ui, sans-serif">2 cores, 0.75× clock, V ×0.85</text>
<rect x="266.0" y="314.0" width="84.2" height="30.0" rx="6" fill="#149ECA" fill-opacity="0.22" stroke="#149ECA" stroke-width="1.6"/>
<text x="360" y="335" text-anchor="start" font-size="13" fill="#149ECA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1.08×</text>
<text x="266" y="362" text-anchor="start" font-size="11.5" fill="#99A1B3" font-family="system-ui, sans-serif">1.5× work for 1.08× power</text>
<text x="360" y="400" text-anchor="middle" font-size="12.5" fill="#F6F7F9" font-family="system-ui, sans-serif">to run a transistor faster you must raise its voltage, and power grows with V squared —</text>
<text x="360" y="424" text-anchor="middle" font-size="12.5" fill="#E06C60" font-family="system-ui, sans-serif">so a chip that was warm at 3 GHz would need a different kind of cooling at 6</text>
</svg>