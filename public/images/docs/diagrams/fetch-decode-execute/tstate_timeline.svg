<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#23272F"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#C1554D"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#087EA4"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#99A1B3"/></marker></defs>
<text x="360" y="28" text-anchor="middle" font-size="17" fill="#23272F" font-family="system-ui, sans-serif">one instruction, five clock ticks</text>
<rect x="42" y="86" width="122" height="96" rx="10" fill="#087EA4" fill-opacity="0.10" stroke="#087EA4" stroke-width="2"/>
<text x="103" y="112" text-anchor="middle" font-size="16" fill="#087EA4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="bold">T1</text>
<text x="103" y="138" text-anchor="middle" font-size="11" fill="#23272F" font-family="system-ui, sans-serif">PC → address bus</text>
<text x="103" y="202" text-anchor="middle" font-size="12" fill="#99A1B3" font-family="system-ui, sans-serif">fetch</text>
<path d="M 165.0 134.0 L 173.0 134.0" fill="none" stroke="#99A1B3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g)"/>
<rect x="176" y="86" width="122" height="96" rx="10" fill="#087EA4" fill-opacity="0.10" stroke="#087EA4" stroke-width="2"/>
<text x="237" y="112" text-anchor="middle" font-size="16" fill="#087EA4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="bold">T2</text>
<text x="237" y="138" text-anchor="middle" font-size="11" fill="#23272F" font-family="system-ui, sans-serif">memory → IR</text>
<text x="237" y="155" text-anchor="middle" font-size="11" fill="#23272F" font-family="system-ui, sans-serif">PC + 1</text>
<text x="237" y="202" text-anchor="middle" font-size="12" fill="#99A1B3" font-family="system-ui, sans-serif">fetch</text>
<path d="M 299.0 134.0 L 307.0 134.0" fill="none" stroke="#99A1B3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g)"/>
<rect x="310" y="86" width="122" height="96" rx="10" fill="#C1554D" fill-opacity="0.10" stroke="#C1554D" stroke-width="2"/>
<text x="371" y="112" text-anchor="middle" font-size="16" fill="#C1554D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="bold">T3</text>
<text x="371" y="138" text-anchor="middle" font-size="11" fill="#23272F" font-family="system-ui, sans-serif">control unit</text>
<text x="371" y="155" text-anchor="middle" font-size="11" fill="#23272F" font-family="system-ui, sans-serif">reads the opcode</text>
<text x="371" y="202" text-anchor="middle" font-size="12" fill="#99A1B3" font-family="system-ui, sans-serif">decode</text>
<path d="M 433.0 134.0 L 441.0 134.0" fill="none" stroke="#99A1B3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g)"/>
<rect x="444" y="86" width="122" height="96" rx="10" fill="#99A1B3" fill-opacity="0.10" stroke="#99A1B3" stroke-width="2"/>
<text x="505" y="112" text-anchor="middle" font-size="16" fill="#99A1B3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="bold">T4</text>
<text x="505" y="138" text-anchor="middle" font-size="11" fill="#23272F" font-family="system-ui, sans-serif">operand → ALU</text>
<text x="505" y="155" text-anchor="middle" font-size="11" fill="#23272F" font-family="system-ui, sans-serif">second input ready</text>
<text x="505" y="202" text-anchor="middle" font-size="12" fill="#99A1B3" font-family="system-ui, sans-serif">execute</text>
<path d="M 567.0 134.0 L 575.0 134.0" fill="none" stroke="#99A1B3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g)"/>
<rect x="578" y="86" width="122" height="96" rx="10" fill="#99A1B3" fill-opacity="0.10" stroke="#99A1B3" stroke-width="2"/>
<text x="639" y="112" text-anchor="middle" font-size="16" fill="#99A1B3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="bold">T5</text>
<text x="639" y="138" text-anchor="middle" font-size="11" fill="#23272F" font-family="system-ui, sans-serif">result → register</text>
<text x="639" y="155" text-anchor="middle" font-size="11" fill="#23272F" font-family="system-ui, sans-serif">flags set</text>
<text x="639" y="202" text-anchor="middle" font-size="12" fill="#99A1B3" font-family="system-ui, sans-serif">execute</text>
<path d="M 42.0 276.0 L 42.0 250.0 L 109.0 250.0 L 109.0 276.0 L 176.0 276.0 L 176.0 250.0 L 243.0 250.0 L 243.0 276.0 L 310.0 276.0 L 310.0 250.0 L 377.0 250.0 L 377.0 276.0 L 444.0 276.0 L 444.0 250.0 L 511.0 250.0 L 511.0 276.0 L 578.0 276.0 L 578.0 250.0 L 645.0 250.0 L 645.0 276.0 L 712.0 276.0" fill="none" stroke="#C1554D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="266" text-anchor="start" font-size="13" fill="#C1554D" font-family="system-ui, sans-serif">clk</text>
<text x="360" y="322" text-anchor="middle" font-size="13" fill="#99A1B3" font-family="system-ui, sans-serif">the phases are not equal, and they are not always five — a simple instruction may take three,</text>
<text x="360" y="344" text-anchor="middle" font-size="13" fill="#99A1B3" font-family="system-ui, sans-serif">a memory access may take dozens, and a modern CPU overlaps several instructions at once</text>
<text x="360" y="378" text-anchor="middle" font-size="13" fill="#23272F" font-family="system-ui, sans-serif">but the order is never violated: nothing executes before it has been fetched</text>
</svg>