<text x="360" y="330" text-anchor="middle" font-size="13" fill="#E06C60" font-family="system-ui, sans-serif">each red drop is one JMP 1 — the PC being written instead of incremented</text>
<text x="74" y="348" text-anchor="middle" font-size="11" fill="#99A1B3" font-family="system-ui, sans-serif">start</text>
<text x="664" y="348" text-anchor="middle" font-size="11" fill="#99A1B3" font-family="system-ui, sans-serif">HLT</text>
<text x="360" y="378" text-anchor="middle" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif">the program has 7 instructions; the processor executed 21 of them</text>
<text x="360" y="402" text-anchor="middle" font-size="13" fill="#99A1B3" font-family="system-ui, sans-serif">a loop is not a structure in memory — it is a shape the PC traces over time</text>
