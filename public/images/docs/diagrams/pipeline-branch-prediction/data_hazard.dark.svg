<text x="388" y="128" text-anchor="middle" font-size="12" fill="#E06C60" font-family="system-ui, sans-serif">r1 is written here, but read here — two cycles too early</text>
<text x="360" y="262" text-anchor="middle" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif">instruction 2 reads r1 in cycle 3; instruction 1 does not write it until cycle 5</text>
<text x="360" y="288" text-anchor="middle" font-size="12.5" fill="#99A1B3" font-family="system-ui, sans-serif">the naive fix is to make instruction 2 wait — two wasted cycles, called a stall or bubble</text>
<text x="360" y="326" text-anchor="middle" font-size="12.5" fill="#E06C60" font-family="system-ui, sans-serif">and this happens constantly, because real code is full of results used immediately</text>
</svg>