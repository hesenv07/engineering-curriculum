<text x="360" y="26" text-anchor="middle" font-size="17" fill="#F6F7F9" font-family="system-ui, sans-serif">the guess, and how it learns</text>
<rect x="18.0" y="110.0" width="148.0" height="62.0" rx="10" fill="#99A1B3" fill-opacity="0.14" stroke="#99A1B3" stroke-width="2"/>
<text x="92" y="136" text-anchor="middle" font-size="12.5" fill="#F6F7F9" font-family="system-ui, sans-serif">strongly</text>
<text x="92" y="156" text-anchor="middle" font-size="14" fill="#99A1B3" font-family="system-ui, sans-serif" font-weight="bold">not taken</text>
<text x="92" y="98" text-anchor="middle" font-size="12" fill="#99A1B3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">00</text>
<rect x="194.0" y="110.0" width="148.0" height="62.0" rx="10" fill="#99A1B3" fill-opacity="0.14" stroke="#99A1B3" stroke-width="2"/>
<text x="268" y="136" text-anchor="middle" font-size="12.5" fill="#F6F7F9" font-family="system-ui, sans-serif">weakly</text>
<text x="268" y="156" text-anchor="middle" font-size="14" fill="#99A1B3" font-family="system-ui, sans-serif" font-weight="bold">not taken</text>
<text x="268" y="98" text-anchor="middle" font-size="12" fill="#99A1B3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">01</text>
<rect x="370.0" y="110.0" width="148.0" height="62.0" rx="10" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="2"/>
