<text x="360" y="76" text-anchor="middle" font-size="12" fill="#149ECA" font-family="system-ui, sans-serif">branch was taken → shift right</text>
<text x="360" y="202" text-anchor="middle" font-size="12" fill="#99A1B3" font-family="system-ui, sans-serif">branch was not taken ← shift left</text>
<text x="360" y="258" text-anchor="middle" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif">predict TAKEN on the right two states, NOT TAKEN on the left two</text>
<text x="360" y="292" text-anchor="middle" font-size="12.5" fill="#99A1B3" font-family="system-ui, sans-serif">two bits, not one, so a single surprise does not flip the prediction —</text>
<text x="360" y="314" text-anchor="middle" font-size="12.5" fill="#99A1B3" font-family="system-ui, sans-serif">a loop that runs a thousand times is mispredicted once, at the end, not twice</text>
<text x="360" y="354" text-anchor="middle" font-size="13" fill="#149ECA" font-family="system-ui, sans-serif">real predictors are far cleverer than this, and get well over 95% right</text>
</svg>