<text x="620" y="136" text-anchor="middle" font-size="12.5" fill="#F6F7F9" font-family="system-ui, sans-serif">strongly</text>
<text x="620" y="156" text-anchor="middle" font-size="14" fill="#149ECA" font-family="system-ui, sans-serif" font-weight="bold">taken</text>
<text x="620" y="98" text-anchor="middle" font-size="12" fill="#99A1B3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">11</text>
