<text x="444" y="156" text-anchor="middle" font-size="14" fill="#149ECA" font-family="system-ui, sans-serif" font-weight="bold">taken</text>
<text x="444" y="98" text-anchor="middle" font-size="12" fill="#99A1B3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">10</text>
