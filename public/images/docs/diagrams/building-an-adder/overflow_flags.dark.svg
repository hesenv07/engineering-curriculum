<path d="M 468 152 L 376 152" fill="none" stroke="#F6F7F9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a1)"/>
<text x="504" y="157" text-anchor="middle" font-size="15" fill="#F6F7F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">C6</text>
<text x="504" y="176" text-anchor="middle" font-size="12" fill="#99A1B3" font-family="system-ui, sans-serif">carry in</text>
