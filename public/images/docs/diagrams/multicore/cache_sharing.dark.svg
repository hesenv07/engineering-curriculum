<text x="360" y="256" text-anchor="middle" font-size="14" fill="#F6F7F9" font-family="system-ui, sans-serif">L3  ·  shared by every core on the chip</text>
<rect x="42.0" y="292.0" width="636.0" height="44.0" rx="10" fill="none" stroke="#99A1B3" stroke-width="2"/>
<text x="360" y="320" text-anchor="middle" font-size="13" fill="#F6F7F9" font-family="system-ui, sans-serif">main memory  ·  one bus, shared by everything</text>
<text x="360" y="366" text-anchor="middle" font-size="12.5" fill="#99A1B3" font-family="system-ui, sans-serif">two logical processors on one core share even their L1 — which is why a memory-hungry</text>
<text x="360" y="388" text-anchor="middle" font-size="12.5" fill="#E06C60" font-family="system-ui, sans-serif">pair can evict each other's data and end up slower than running one at a time</text>
