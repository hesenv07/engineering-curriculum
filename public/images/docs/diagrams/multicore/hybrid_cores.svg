<text x="639" y="211" text-anchor="middle" font-size="13" fill="#23272F" font-family="system-ui, sans-serif">E7</text>
<text x="530" y="244" text-anchor="middle" font-size="11.5" fill="#23272F" font-family="system-ui, sans-serif">small, simple, sip power —</text>
<text x="530" y="260" text-anchor="middle" font-size="11.5" fill="#23272F" font-family="system-ui, sans-serif">for everything in the background</text>
<text x="360" y="304" text-anchor="middle" font-size="13" fill="#23272F" font-family="system-ui, sans-serif">if most of the chip has to stay dark, you want the option of lighting the cheap thing</text>
<text x="360" y="332" text-anchor="middle" font-size="12.5" fill="#99A1B3" font-family="system-ui, sans-serif">and now the scheduler has a genuinely hard question: which kind of core does this thread deserve?</text>
<text x="360" y="368" text-anchor="middle" font-size="13" fill="#087EA4" font-family="system-ui, sans-serif">“four cores” stopped being a useful description of a processor</text>
