<text x="252" y="211" text-anchor="middle" font-size="15" fill="#23272F" font-family="system-ui, sans-serif">P3</text>
<text x="190" y="244" text-anchor="middle" font-size="11.5" fill="#23272F" font-family="system-ui, sans-serif">big, deep, power-hungry —</text>
<text x="190" y="260" text-anchor="middle" font-size="11.5" fill="#23272F" font-family="system-ui, sans-serif">for the task you are waiting on</text>
