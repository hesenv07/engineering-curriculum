<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 476"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#23272F"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#C1554D"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#087EA4"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#99A1B3"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-size="17" fill="#23272F" font-family="system-ui, sans-serif">one barista, or two</text>
<text x="360" y="60" text-anchor="middle" font-size="14" fill="#C1554D" font-family="system-ui, sans-serif" font-weight="bold">CONCURRENCY  ·  one barista, two customers</text>
<text x="114" y="99" text-anchor="end" font-size="12.5" fill="#23272F" font-family="system-ui, sans-serif">barista</text>
<rect x="128.0" y="78.0" width="86.3" height="32.0" rx="5" fill="#C1554D" fill-opacity="0.28" stroke="#C1554D" stroke-width="1.4"/>
<text x="171" y="99" text-anchor="middle" font-size="10.5" fill="#23272F" font-family="system-ui, sans-serif">take A's order</text>
<rect x="217.3" y="78.0" width="86.3" height="32.0" rx="5" fill="#C1554D" fill-opacity="0.28" stroke="#C1554D" stroke-width="1.4"/>
<text x="260" y="99" text-anchor="middle" font-size="10.5" fill="#23272F" font-family="system-ui, sans-serif">take B's order</text>
<rect x="351.3" y="78.0" width="86.3" height="32.0" rx="5" fill="#C1554D" fill-opacity="0.28" stroke="#C1554D" stroke-width="1.4"/>
<text x="394" y="99" text-anchor="middle" font-size="10.5" fill="#23272F" font-family="system-ui, sans-serif">finish A</text>
<rect x="485.3" y="78.0" width="86.3" height="32.0" rx="5" fill="#C1554D" fill-opacity="0.28" stroke="#C1554D" stroke-width="1.4"/>
<text x="528" y="99" text-anchor="middle" font-size="10.5" fill="#23272F" font-family="system-ui, sans-serif">finish B</text>
<text x="128" y="128" text-anchor="start" font-size="11.5" fill="#99A1B3" font-family="system-ui, sans-serif">busy whenever there is something to do</text>
<text x="114" y="167" text-anchor="end" font-size="12.5" fill="#23272F" font-family="system-ui, sans-serif">drink A</text>
<rect x="128.0" y="146.0" width="86.3" height="32.0" rx="5" fill="#99A1B3" fill-opacity="0.28" stroke="#99A1B3" stroke-width="1.4"/>
<text x="171" y="167" text-anchor="middle" font-size="10.5" fill="#23272F" font-family="system-ui, sans-serif">ordered</text>
<rect x="217.3" y="146.0" width="131.0" height="32.0" rx="5" fill="#087EA4" fill-opacity="0.28" stroke="#087EA4" stroke-width="1.4"/>
<text x="283" y="167" text-anchor="middle" font-size="10.5" fill="#23272F" font-family="system-ui, sans-serif">machine runs</text>
<rect x="351.3" y="146.0" width="86.3" height="32.0" rx="5" fill="#99A1B3" fill-opacity="0.28" stroke="#99A1B3" stroke-width="1.4"/>
<text x="394" y="167" text-anchor="middle" font-size="10.5" fill="#23272F" font-family="system-ui, sans-serif">served</text>
<text x="128" y="196" text-anchor="start" font-size="11.5" fill="#087EA4" font-family="system-ui, sans-serif">progresses while the barista is elsewhere</text>
<text x="114" y="235" text-anchor="end" font-size="12.5" fill="#23272F" font-family="system-ui, sans-serif">drink B</text>
<rect x="217.3" y="214.0" width="86.3" height="32.0" rx="5" fill="#99A1B3" fill-opacity="0.28" stroke="#99A1B3" stroke-width="1.4"/>
<text x="260" y="235" text-anchor="middle" font-size="10.5" fill="#23272F" font-family="system-ui, sans-serif">ordered</text>
<rect x="306.7" y="214.0" width="175.7" height="32.0" rx="5" fill="#087EA4" fill-opacity="0.28" stroke="#087EA4" stroke-width="1.4"/>
<text x="394" y="235" text-anchor="middle" font-size="10.5" fill="#23272F" font-family="system-ui, sans-serif">machine runs</text>
<rect x="485.3" y="214.0" width="86.3" height="32.0" rx="5" fill="#99A1B3" fill-opacity="0.28" stroke="#99A1B3" stroke-width="1.4"/>
<text x="528" y="235" text-anchor="middle" font-size="10.5" fill="#23272F" font-family="system-ui, sans-serif">served</text>
<text x="128" y="264" text-anchor="start" font-size="11.5" fill="#087EA4" font-family="system-ui, sans-serif">so does this one — both are in flight at once</text>
<text x="360" y="282" text-anchor="middle" font-size="12.5" fill="#23272F" font-family="system-ui, sans-serif">two jobs make progress together, but the barista only ever does one thing at a time</text>
<text x="360" y="324" text-anchor="middle" font-size="14" fill="#087EA4" font-family="system-ui, sans-serif" font-weight="bold">PARALLELISM  ·  two baristas</text>
<text x="114" y="363" text-anchor="end" font-size="12.5" fill="#23272F" font-family="system-ui, sans-serif">barista 1</text>
<rect x="128.0" y="342.0" width="309.7" height="32.0" rx="5" fill="#087EA4" fill-opacity="0.28" stroke="#087EA4" stroke-width="1.4"/>
<text x="283" y="363" text-anchor="middle" font-size="10.5" fill="#23272F" font-family="system-ui, sans-serif">makes drink A start to finish</text>
<text x="128" y="392" text-anchor="start" font-size="11.5" fill="#99A1B3" font-family="system-ui, sans-serif"></text>
<text x="114" y="411" text-anchor="end" font-size="12.5" fill="#23272F" font-family="system-ui, sans-serif">barista 2</text>
<rect x="128.0" y="390.0" width="309.7" height="32.0" rx="5" fill="#087EA4" fill-opacity="0.28" stroke="#087EA4" stroke-width="1.4"/>
<text x="283" y="411" text-anchor="middle" font-size="10.5" fill="#23272F" font-family="system-ui, sans-serif">makes drink B start to finish</text>
<text x="128" y="440" text-anchor="start" font-size="11.5" fill="#087EA4" font-family="system-ui, sans-serif">two hands doing two things in the same instant</text>
<text x="360" y="464" text-anchor="middle" font-size="13.5" fill="#23272F" font-family="system-ui, sans-serif">one core can be concurrent. only more cores can be parallel.</text>
</svg>