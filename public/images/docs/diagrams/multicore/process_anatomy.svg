<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#23272F"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#C1554D"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#087EA4"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#99A1B3"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-size="17" fill="#23272F" font-family="system-ui, sans-serif">what happens when you run a program</text>
<rect x="26.0" y="52.0" width="292.0" height="300.0" rx="12" fill="none" stroke="#087EA4" stroke-width="2.4"/>
<text x="46" y="74" text-anchor="start" font-size="13.5" fill="#087EA4" font-family="system-ui, sans-serif" font-weight="bold">process A  (your editor)</text>
<rect x="44.0" y="92.0" width="256.0" height="56.0" rx="8" fill="#99A1B3" fill-opacity="0.14" stroke="#99A1B3" stroke-width="1.6"/>
<text x="172" y="116" text-anchor="middle" font-size="13" fill="#23272F" font-family="system-ui, sans-serif">the code</text>
<text x="172" y="135" text-anchor="middle" font-size="10.5" fill="#99A1B3" font-family="system-ui, sans-serif">the instructions, loaded from the file</text>
<rect x="44.0" y="156.0" width="256.0" height="56.0" rx="8" fill="#99A1B3" fill-opacity="0.14" stroke="#99A1B3" stroke-width="1.6"/>
<text x="172" y="180" text-anchor="middle" font-size="13" fill="#23272F" font-family="system-ui, sans-serif">globals</text>
<text x="172" y="199" text-anchor="middle" font-size="10.5" fill="#99A1B3" font-family="system-ui, sans-serif">variables that live for the whole program</text>
<rect x="44.0" y="220.0" width="256.0" height="56.0" rx="8" fill="#99A1B3" fill-opacity="0.14" stroke="#99A1B3" stroke-width="1.6"/>
<text x="172" y="244" text-anchor="middle" font-size="13" fill="#23272F" font-family="system-ui, sans-serif">the heap</text>
<text x="172" y="263" text-anchor="middle" font-size="10.5" fill="#99A1B3" font-family="system-ui, sans-serif">memory you asked for at runtime</text>
<rect x="44.0" y="284.0" width="256.0" height="56.0" rx="8" fill="#C1554D" fill-opacity="0.14" stroke="#C1554D" stroke-width="1.6"/>
<text x="172" y="308" text-anchor="middle" font-size="13" fill="#23272F" font-family="system-ui, sans-serif">the stack</text>
<text x="172" y="327" text-anchor="middle" font-size="10.5" fill="#99A1B3" font-family="system-ui, sans-serif">where the program is, and its local variables</text>
<rect x="402.0" y="52.0" width="292.0" height="300.0" rx="12" fill="none" stroke="#99A1B3" stroke-width="2.4"/>
<text x="422" y="74" text-anchor="start" font-size="13.5" fill="#99A1B3" font-family="system-ui, sans-serif" font-weight="bold">process B  (your browser)</text>
<rect x="420.0" y="92.0" width="256.0" height="56.0" rx="8" fill="none" stroke="#99A1B3" stroke-width="1.6"/>
<text x="548" y="116" text-anchor="middle" font-size="13" fill="#99A1B3" font-family="system-ui, sans-serif">the code</text>
<text x="548" y="135" text-anchor="middle" font-size="10.5" fill="#99A1B3" font-family="system-ui, sans-serif">its own copy, entirely separate</text>
<rect x="420.0" y="156.0" width="256.0" height="56.0" rx="8" fill="none" stroke="#99A1B3" stroke-width="1.6"/>
<text x="548" y="180" text-anchor="middle" font-size="13" fill="#99A1B3" font-family="system-ui, sans-serif">globals</text>
<text x="548" y="199" text-anchor="middle" font-size="10.5" fill="#99A1B3" font-family="system-ui, sans-serif">its own copy, entirely separate</text>
<rect x="420.0" y="220.0" width="256.0" height="56.0" rx="8" fill="none" stroke="#99A1B3" stroke-width="1.6"/>
<text x="548" y="244" text-anchor="middle" font-size="13" fill="#99A1B3" font-family="system-ui, sans-serif">the heap</text>
<text x="548" y="263" text-anchor="middle" font-size="10.5" fill="#99A1B3" font-family="system-ui, sans-serif">its own copy, entirely separate</text>
<rect x="420.0" y="284.0" width="256.0" height="56.0" rx="8" fill="none" stroke="#99A1B3" stroke-width="1.6"/>
<text x="548" y="308" text-anchor="middle" font-size="13" fill="#99A1B3" font-family="system-ui, sans-serif">the stack</text>
<text x="548" y="327" text-anchor="middle" font-size="10.5" fill="#99A1B3" font-family="system-ui, sans-serif">its own copy, entirely separate</text>
<path d="M 330.0 200.0 L 390.0 200.0" fill="none" stroke="#C1554D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 348 176 L 372 224 M 372 176 L 348 224" stroke="#C1554D" stroke-width="3"/>
<text x="360" y="250" text-anchor="middle" font-size="11" fill="#C1554D" font-family="system-ui, sans-serif">cannot</text>
<text x="360" y="264" text-anchor="middle" font-size="11" fill="#C1554D" font-family="system-ui, sans-serif">see</text>
<text x="360" y="380" text-anchor="middle" font-size="13.5" fill="#23272F" font-family="system-ui, sans-serif">a process is a running program plus its own private memory</text>
<text x="360" y="406" text-anchor="middle" font-size="12.5" fill="#99A1B3" font-family="system-ui, sans-serif">one crashing cannot corrupt the other — the isolation is enforced by hardware</text>
</svg>