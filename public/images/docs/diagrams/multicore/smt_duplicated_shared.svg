<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#23272F"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#C1554D"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#087EA4"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#99A1B3"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-size="17" fill="#23272F" font-family="system-ui, sans-serif">what gets copied, and what gets shared</text>
<rect x="40.0" y="52.0" width="640.0" height="300.0" rx="14" fill="none" stroke="#23272F" stroke-width="2.4"/>
<text x="60" y="74" text-anchor="start" font-size="14" fill="#23272F" font-family="system-ui, sans-serif" font-weight="bold">one physical core</text>
<rect x="70.0" y="90.0" width="270.0" height="92.0" rx="10" fill="#087EA4" fill-opacity="0.14" stroke="#087EA4" stroke-width="2"/>
<text x="205" y="114" text-anchor="middle" font-size="13.5" fill="#087EA4" font-family="system-ui, sans-serif" font-weight="bold">logical processor 1</text>
<text x="205" y="138" text-anchor="middle" font-size="11.5" fill="#23272F" font-family="system-ui, sans-serif">own registers · own PC · own flags</text>
<text x="205" y="160" text-anchor="middle" font-size="11" fill="#99A1B3" font-family="system-ui, sans-serif">the OS sees a whole CPU here</text>
<rect x="370.0" y="90.0" width="270.0" height="92.0" rx="10" fill="#5aa9c4" fill-opacity="0.14" stroke="#5aa9c4" stroke-width="2"/>
<text x="505" y="114" text-anchor="middle" font-size="13.5" fill="#5aa9c4" font-family="system-ui, sans-serif" font-weight="bold">logical processor 2</text>
<text x="505" y="138" text-anchor="middle" font-size="11.5" fill="#23272F" font-family="system-ui, sans-serif">own registers · own PC · own flags</text>
<text x="505" y="160" text-anchor="middle" font-size="11" fill="#99A1B3" font-family="system-ui, sans-serif">the OS sees a whole CPU here</text>
<text x="360" y="204" text-anchor="middle" font-size="12.5" fill="#087EA4" font-family="system-ui, sans-serif">duplicated — cheap, only a few thousand transistors</text>
<rect x="70.0" y="224.0" width="270.0" height="44.0" rx="8" fill="#C1554D" fill-opacity="0.14" stroke="#C1554D" stroke-width="2"/>
<text x="205" y="252" text-anchor="middle" font-size="12.5" fill="#23272F" font-family="system-ui, sans-serif">ALUs and the FPU</text>
<rect x="370.0" y="224.0" width="270.0" height="44.0" rx="8" fill="#C1554D" fill-opacity="0.14" stroke="#C1554D" stroke-width="2"/>
<text x="505" y="252" text-anchor="middle" font-size="12.5" fill="#23272F" font-family="system-ui, sans-serif">L1 and L2 cache</text>
<rect x="70.0" y="280.0" width="270.0" height="44.0" rx="8" fill="#C1554D" fill-opacity="0.14" stroke="#C1554D" stroke-width="2"/>
<text x="205" y="308" text-anchor="middle" font-size="12.5" fill="#23272F" font-family="system-ui, sans-serif">branch predictor</text>
<rect x="370.0" y="280.0" width="270.0" height="44.0" rx="8" fill="#C1554D" fill-opacity="0.14" stroke="#C1554D" stroke-width="2"/>
<text x="505" y="308" text-anchor="middle" font-size="12.5" fill="#23272F" font-family="system-ui, sans-serif">the pipeline itself</text>
<text x="360" y="344" text-anchor="middle" font-size="12.5" fill="#C1554D" font-family="system-ui, sans-serif">shared — and this is where the fighting happens</text>
<text x="360" y="382" text-anchor="middle" font-size="13" fill="#23272F" font-family="system-ui, sans-serif">SMT does not add an execution engine. it adds a second place to stand while waiting for one.</text>
<text x="360" y="406" text-anchor="middle" font-size="12.5" fill="#99A1B3" font-family="system-ui, sans-serif">that is why two logical processors are nothing like two cores</text>
</svg>