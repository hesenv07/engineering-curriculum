<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#F6F7F9"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#E06C60"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#149ECA"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#99A1B3"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-size="17" fill="#F6F7F9" font-family="system-ui, sans-serif">one process, three threads</text>
<rect x="26.0" y="50.0" width="668.0" height="336.0" rx="13" fill="none" stroke="#149ECA" stroke-width="2.4"/>
<text x="46" y="72" text-anchor="start" font-size="13.5" fill="#149ECA" font-family="system-ui, sans-serif" font-weight="bold">one process</text>
<text x="360" y="96" text-anchor="middle" font-size="12.5" fill="#E06C60" font-family="system-ui, sans-serif">each thread has its own —</text>
<rect x="62.0" y="108.0" width="188.0" height="112.0" rx="10" fill="#E06C60" fill-opacity="0.14" stroke="#E06C60" stroke-width="2"/>
<text x="156" y="132" text-anchor="middle" font-size="13.5" fill="#E06C60" font-family="system-ui, sans-serif" font-weight="bold">thread 1</text>
<text x="156" y="156" text-anchor="middle" font-size="11.5" fill="#F6F7F9" font-family="system-ui, sans-serif">program counter</text>
<text x="156" y="176" text-anchor="middle" font-size="11.5" fill="#F6F7F9" font-family="system-ui, sans-serif">registers</text>
<text x="156" y="196" text-anchor="middle" font-size="11.5" fill="#F6F7F9" font-family="system-ui, sans-serif">its own stack</text>
<rect x="270.0" y="108.0" width="188.0" height="112.0" rx="10" fill="#E06C60" fill-opacity="0.14" stroke="#E06C60" stroke-width="2"/>
<text x="364" y="132" text-anchor="middle" font-size="13.5" fill="#E06C60" font-family="system-ui, sans-serif" font-weight="bold">thread 2</text>
<text x="364" y="156" text-anchor="middle" font-size="11.5" fill="#F6F7F9" font-family="system-ui, sans-serif">program counter</text>
<text x="364" y="176" text-anchor="middle" font-size="11.5" fill="#F6F7F9" font-family="system-ui, sans-serif">registers</text>
<text x="364" y="196" text-anchor="middle" font-size="11.5" fill="#F6F7F9" font-family="system-ui, sans-serif">its own stack</text>
<rect x="478.0" y="108.0" width="188.0" height="112.0" rx="10" fill="#E06C60" fill-opacity="0.14" stroke="#E06C60" stroke-width="2"/>
<text x="572" y="132" text-anchor="middle" font-size="13.5" fill="#E06C60" font-family="system-ui, sans-serif" font-weight="bold">thread 3</text>
<text x="572" y="156" text-anchor="middle" font-size="11.5" fill="#F6F7F9" font-family="system-ui, sans-serif">program counter</text>
<text x="572" y="176" text-anchor="middle" font-size="11.5" fill="#F6F7F9" font-family="system-ui, sans-serif">registers</text>
<text x="572" y="196" text-anchor="middle" font-size="11.5" fill="#F6F7F9" font-family="system-ui, sans-serif">its own stack</text>
<text x="360" y="250" text-anchor="middle" font-size="12.5" fill="#149ECA" font-family="system-ui, sans-serif">and all of them share —</text>
<rect x="62.0" y="262.0" width="136.0" height="48.0" rx="8" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="2"/>
<text x="130" y="291" text-anchor="middle" font-size="12.5" fill="#F6F7F9" font-family="system-ui, sans-serif">the code</text>
<rect x="214.0" y="262.0" width="136.0" height="48.0" rx="8" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="2"/>
<text x="282" y="291" text-anchor="middle" font-size="12.5" fill="#F6F7F9" font-family="system-ui, sans-serif">globals</text>
<rect x="366.0" y="262.0" width="136.0" height="48.0" rx="8" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="2"/>
<text x="434" y="291" text-anchor="middle" font-size="12.5" fill="#F6F7F9" font-family="system-ui, sans-serif">the heap</text>
<rect x="518.0" y="262.0" width="136.0" height="48.0" rx="8" fill="#149ECA" fill-opacity="0.14" stroke="#149ECA" stroke-width="2"/>
<text x="586" y="291" text-anchor="middle" font-size="12.5" fill="#F6F7F9" font-family="system-ui, sans-serif">open files</text>
<text x="360" y="336" text-anchor="middle" font-size="12.5" fill="#F6F7F9" font-family="system-ui, sans-serif">sharing memory is what makes threads cheap to talk between — and easy to break</text>
<text x="360" y="362" text-anchor="middle" font-size="12" fill="#E06C60" font-family="system-ui, sans-serif">two threads writing the same variable is a data race, and nothing stops them</text>
<text x="360" y="412" text-anchor="middle" font-size="13.5" fill="#F6F7F9" font-family="system-ui, sans-serif">a process is isolation. a thread is a second place in the same program.</text>
</svg>