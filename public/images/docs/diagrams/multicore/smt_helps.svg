<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 360"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#23272F"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#C1554D"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#087EA4"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#99A1B3"/></marker></defs>
<text x="170" y="26" text-anchor="middle" font-size="15" fill="#23272F" font-family="system-ui, sans-serif">when SMT wins</text>
<text x="170" y="48" text-anchor="middle" font-size="11.5" fill="#99A1B3" font-family="system-ui, sans-serif">the two jobs need different things</text>
<rect x="26.0" y="74.0" width="288.0" height="60.0" rx="9" fill="#087EA4" fill-opacity="0.14" stroke="#087EA4" stroke-width="2"/>
<text x="170" y="100" text-anchor="middle" font-size="13.5" fill="#087EA4" font-family="system-ui, sans-serif" font-weight="bold">thread A</text>
<text x="170" y="120" text-anchor="middle" font-size="11.5" fill="#23272F" font-family="system-ui, sans-serif">waiting on memory, often stalled</text>
<rect x="26.0" y="146.0" width="288.0" height="60.0" rx="9" fill="#5aa9c4" fill-opacity="0.14" stroke="#5aa9c4" stroke-width="2"/>
<text x="170" y="172" text-anchor="middle" font-size="13.5" fill="#5aa9c4" font-family="system-ui, sans-serif" font-weight="bold">thread B</text>
<text x="170" y="192" text-anchor="middle" font-size="11.5" fill="#23272F" font-family="system-ui, sans-serif">pure arithmetic, uses the ALUs</text>
<rect x="26.0" y="226.0" width="288.0" height="62.0" rx="10" fill="#087EA4" fill-opacity="0.14" stroke="#087EA4" stroke-width="2"/>
<text x="170" y="252" text-anchor="middle" font-size="15" fill="#087EA4" font-family="system-ui, sans-serif" font-weight="bold">up to about +30%</text>
<text x="170" y="274" text-anchor="middle" font-size="11.5" fill="#23272F" font-family="system-ui, sans-serif">B works in the gaps A leaves behind</text>
</svg>