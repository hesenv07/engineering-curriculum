<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, sans-serif">
<text x="360" y="28" text-anchor="middle" font-size="17" fill="#F6F7F9">a real NAND gate: four transistors</text>
<path d="M 214 66 L 506 66" fill="none" stroke="#99A1B3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="196" y="71" text-anchor="end" font-size="14" fill="#F6F7F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1</text>
<text x="196" y="88" text-anchor="end" font-size="11" fill="#99A1B3">power</text>
<path d="M 214 348 L 506 348" fill="none" stroke="#99A1B3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="196" y="353" text-anchor="end" font-size="14" fill="#F6F7F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0</text>
<text x="196" y="370" text-anchor="end" font-size="11" fill="#99A1B3">ground</text>
<path d="M 260 66 L 260 96" fill="none" stroke="#99A1B3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="260" cy="96" r="3.4" fill="#149ECA"/>
<circle cx="260" cy="150" r="3.4" fill="#149ECA"/>
<line x1="260" y1="96" x2="260" y2="150" stroke="#149ECA" stroke-width="2.6" stroke-linecap="round"/>
<path d="M 260 150 L 260 190" fill="none" stroke="#99A1B3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="286" y="126" text-anchor="start" font-size="12" fill="#E06C60">closes if</text>
<text x="286" y="144" text-anchor="start" font-size="12" fill="#E06C60">A = 0</text>
<path d="M 420 66 L 420 96" fill="none" stroke="#99A1B3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="420" cy="96" r="3.4" fill="#149ECA"/>
<circle cx="420" cy="150" r="3.4" fill="#149ECA"/>
<line x1="420" y1="96" x2="420" y2="150" stroke="#149ECA" stroke-width="2.6" stroke-linecap="round"/>
<path d="M 420 150 L 420 190" fill="none" stroke="#99A1B3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="446" y="126" text-anchor="start" font-size="12" fill="#E06C60">closes if</text>
<text x="446" y="144" text-anchor="start" font-size="12" fill="#E06C60">B = 0</text>
<path d="M 260 190 L 420 190" fill="none" stroke="#99A1B3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 360 190 L 360 198" fill="none" stroke="#99A1B3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="360" cy="190" r="4.5" fill="#149ECA"/>
<path d="M 360 190 L 596 190" fill="none" stroke="#149ECA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="612" y="195" text-anchor="start" font-size="16" fill="#149ECA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">out</text>
<path d="M 360 190 L 360 216" fill="none" stroke="#99A1B3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="360" cy="216" r="3.4" fill="#99A1B3"/>
<circle cx="360" cy="260" r="3.4" fill="#99A1B3"/>
<line x1="360" y1="216" x2="378" y2="254" stroke="#99A1B3" stroke-width="2.6" stroke-linecap="round"/>
<path d="M 360 260 L 360 276" fill="none" stroke="#99A1B3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="360" cy="276" r="3.4" fill="#99A1B3"/>
<circle cx="360" cy="320" r="3.4" fill="#99A1B3"/>
<line x1="360" y1="276" x2="378" y2="314" stroke="#99A1B3" stroke-width="2.6" stroke-linecap="round"/>
<path d="M 360 320 L 360 348" fill="none" stroke="#99A1B3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="386" y="242" text-anchor="start" font-size="12" fill="#149ECA">closes if A = 1</text>
<text x="386" y="302" text-anchor="start" font-size="12" fill="#149ECA">closes if B = 1</text>
<text x="260" y="52" text-anchor="middle" font-size="15" fill="#F6F7F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">A</text>
<text x="420" y="52" text-anchor="middle" font-size="15" fill="#F6F7F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">B</text>
<text x="30" y="150" text-anchor="start" font-size="13" fill="#E06C60">two switches side by side:</text>
<text x="30" y="168" text-anchor="start" font-size="13" fill="#E06C60">either one can pull out to 1</text>
<text x="30" y="264" text-anchor="start" font-size="13" fill="#149ECA">two switches in a row:</text>
<text x="30" y="282" text-anchor="start" font-size="13" fill="#149ECA">both needed to pull out to 0</text>
<text x="360" y="384" text-anchor="middle" font-size="13" fill="#99A1B3">out drops to 0 only when A = 1 and B = 1 — which is exactly NAND</text>
</svg>