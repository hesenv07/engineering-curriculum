<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360"><defs><marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#23272F"/></marker><marker id="c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#C1554D"/></marker><marker id="c3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#087EA4"/></marker><pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#C1554D" stroke-width="2.4" opacity="0.5"/></pattern></defs>
<text x="360" y="28" text-anchor="middle" font-size="17" fill="#23272F" font-family="system-ui, sans-serif">what has to fit between two ticks</text>
<text x="114" y="110" text-anchor="end" font-size="14" fill="#23272F" font-family="system-ui, sans-serif">at 3 GHz</text>
<rect x="130" y="86" width="383" height="40" rx="6" fill="none" stroke="#23272F" stroke-width="2"/>
<text x="321" y="78" text-anchor="middle" font-size="12" fill="#23272F" font-family="system-ui, sans-serif">clock period = 333 ps</text>
<rect x="130" y="90" width="34" height="32" rx="4" fill="#99A1B3" fill-opacity="0.22" stroke="#99A1B3" stroke-width="1.6"/>
<rect x="164" y="90" width="288" height="32" rx="4" fill="#087EA4" fill-opacity="0.22" stroke="#087EA4" stroke-width="1.6"/>
<text x="308" y="110" text-anchor="middle" font-size="11" fill="#23272F" font-family="system-ui, sans-serif">logic delay</text>
<rect x="452" y="90" width="23" height="32" rx="4" fill="#99A1B3" fill-opacity="0.22" stroke="#99A1B3" stroke-width="1.6"/>
<rect x="475" y="90" width="29" height="32" rx="4" fill="#C1554D" fill-opacity="0.22" stroke="#C1554D" stroke-width="1.6"/>
<rect x="504" y="90" width="9" height="32" rx="4" fill="#087EA4" fill-opacity="0.10" stroke="#087EA4" stroke-width="1.4" stroke-dasharray="4 4"/>
<text x="130" y="146" text-anchor="start" font-size="13" fill="#087EA4" font-family="system-ui, sans-serif">✓ fits, with 8 ps to spare</text>
<text x="114" y="234" text-anchor="end" font-size="14" fill="#23272F" font-family="system-ui, sans-serif">at 4 GHz</text>
<rect x="130" y="210" width="288" height="40" rx="6" fill="none" stroke="#23272F" stroke-width="2"/>
<text x="274" y="202" text-anchor="middle" font-size="12" fill="#23272F" font-family="system-ui, sans-serif">clock period = 250 ps</text>
<rect x="130" y="214" width="34" height="32" rx="4" fill="#99A1B3" fill-opacity="0.22" stroke="#99A1B3" stroke-width="1.6"/>
<rect x="164" y="214" width="288" height="32" rx="4" fill="#087EA4" fill-opacity="0.22" stroke="#087EA4" stroke-width="1.6"/>
<text x="308" y="234" text-anchor="middle" font-size="11" fill="#23272F" font-family="system-ui, sans-serif">logic delay</text>
<rect x="452" y="214" width="23" height="32" rx="4" fill="#99A1B3" fill-opacity="0.22" stroke="#99A1B3" stroke-width="1.6"/>
<rect x="475" y="214" width="29" height="32" rx="4" fill="#C1554D" fill-opacity="0.22" stroke="#C1554D" stroke-width="1.6"/>
<rect x="418" y="214" width="86" height="32" rx="4" fill="#C1554D" fill-opacity="0.30" stroke="#C1554D" stroke-width="2"/>
<text x="467" y="234" text-anchor="middle" font-size="11" fill="#C1554D" font-family="system-ui, sans-serif">late</text>
<text x="130" y="270" text-anchor="start" font-size="13" fill="#C1554D" font-family="system-ui, sans-serif">✗ misses the edge by 75 ps</text>
<text x="360" y="314" text-anchor="middle" font-size="13" fill="#23272F" font-family="system-ui, sans-serif">30 + 250 + 20 + 25 = 325 ps of work must finish before the next rising edge</text>
<text x="360" y="340" text-anchor="middle" font-size="13" fill="#99A1B3" font-family="system-ui, sans-serif">the slowest path in the whole chip sets the clock for every part of it</text>
</svg>