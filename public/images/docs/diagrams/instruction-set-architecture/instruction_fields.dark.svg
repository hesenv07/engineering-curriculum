<text x="360" y="310" text-anchor="middle" font-size="11.5" fill="#F6F7F9" font-family="system-ui, sans-serif">constant</text>
<rect x="459" y="288" width="82" height="34" rx="5" fill="#99A1B3" fill-opacity="0.20" stroke="#99A1B3" stroke-width="1.6"/>
<text x="500" y="310" text-anchor="middle" font-size="11.5" fill="#F6F7F9" font-family="system-ui, sans-serif">Rn</text>
<rect x="542" y="288" width="82" height="34" rx="5" fill="#99A1B3" fill-opacity="0.20" stroke="#99A1B3" stroke-width="1.6"/>
<text x="583" y="310" text-anchor="middle" font-size="11.5" fill="#F6F7F9" font-family="system-ui, sans-serif">Rd</text>
<text x="360" y="348" text-anchor="middle" font-size="13" fill="#E06C60" font-family="system-ui, sans-serif">12 bits for the constant means the biggest number you can add in one</text>
<text x="360" y="370" text-anchor="middle" font-size="13" fill="#E06C60" font-family="system-ui, sans-serif">instruction is 4,095. Want 5,000? That takes two instructions.</text>
