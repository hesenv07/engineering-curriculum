<text x="359" y="130" text-anchor="middle" font-size="11.5" fill="#E06C60" font-family="system-ui, sans-serif">imm12</text>
<text x="359" y="156" text-anchor="middle" font-size="10.5" fill="#99A1B3" font-family="system-ui, sans-serif">12 bits</text>
<text x="359" y="172" text-anchor="middle" font-size="10.5" fill="#F6F7F9" font-family="system-ui, sans-serif">the constant: 1</text>
<rect x="480" y="112" width="98" height="26" rx="5" fill="#99A1B3" fill-opacity="0.16" stroke="#99A1B3" stroke-width="1.8"/>
<text x="529" y="130" text-anchor="middle" font-size="11.5" fill="#99A1B3" font-family="system-ui, sans-serif">Rn</text>
<text x="529" y="156" text-anchor="middle" font-size="10.5" fill="#99A1B3" font-family="system-ui, sans-serif">5 bits</text>
<text x="529" y="172" text-anchor="middle" font-size="10.5" fill="#F6F7F9" font-family="system-ui, sans-serif">source: w1</text>
<rect x="580" y="112" width="98" height="26" rx="5" fill="#99A1B3" fill-opacity="0.16" stroke="#99A1B3" stroke-width="1.8"/>
<text x="629" y="130" text-anchor="middle" font-size="11.5" fill="#99A1B3" font-family="system-ui, sans-serif">Rd</text>
<text x="629" y="156" text-anchor="middle" font-size="10.5" fill="#99A1B3" font-family="system-ui, sans-serif">5 bits</text>
<text x="629" y="172" text-anchor="middle" font-size="10.5" fill="#F6F7F9" font-family="system-ui, sans-serif">destination: w1</text>
<text x="360" y="226" text-anchor="middle" font-size="20" fill="#F6F7F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">add  w1, w1, #1</text>
<text x="360" y="268" text-anchor="middle" font-size="13" fill="#99A1B3" font-family="system-ui, sans-serif">the budget: 32 bits, and every field is taken from the same purse</text>
